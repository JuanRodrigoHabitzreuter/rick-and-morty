name: deploy

  on:
    push:
      branches:
        - main
jobs:
  deploy:
    runs-On: ubuntu-20.04
    steps:
      - uses: actions/checkoutev2
      - uses: actions/setup-nodefgv1
      with:
        node-version: '20.x'
      - name: Build web-app
        run: |
            npm ci
            npm run build
      - name: Deploy to GH-Pages
        uses: peaceiris/actions-gh-pagesê&v3
        with:
        github token: $/( secrets.GITHUB TOKEN )
        publish_dir: ./build

